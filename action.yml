name: LaraBeacon Laravel Scan
description: Check a Laravel application for performance, security, and reliability risks and report findings to GitHub code scanning.
author: Bär Softwareentwicklung UG (haftungsbeschränkt)

branding:
  icon: shield
  color: orange

inputs:
  working-directory:
    description: Directory containing the Laravel application.
    required: false
    default: '.'
  profile:
    description: LaraBeacon scan profile.
    required: false
    default: ci
  fail-on:
    description: Lowest severity that fails the step (critical, major, minor, or info).
    required: false
    default: major
  baseline:
    description: Optional baseline file. When set, only new findings fail the step.
    required: false
    default: ''
  sarif-file:
    description: Relative path of the SARIF report inside the working directory.
    required: false
    default: larabeacon.sarif
  upload-sarif:
    description: Upload the SARIF report to GitHub code scanning. Requires the security-events write permission.
    required: false
    default: 'true'
  args:
    description: Additional arguments passed to php artisan larabeacon, split on whitespace (quotes are not interpreted).
    required: false
    default: ''
  report:
    description: Send the run to LaraBeacon Cloud with the commit and branch. Requires cloud-username and cloud-api-token; without them the upload is skipped with a warning (for example in pull requests from forks).
    required: false
    default: 'false'
  cloud-username:
    description: LaraBeacon Cloud project username (lbp_...). Pass it from a secret.
    required: false
    default: ''
  cloud-api-token:
    description: LaraBeacon Cloud project API token. Pass it from a secret.
    required: false
    default: ''
  cloud-endpoint:
    description: LaraBeacon Cloud API endpoint.
    required: false
    default: https://larabeacon.com/api/

outputs:
  sarif-file:
    description: Path of the generated SARIF report.
    value: ${{ steps.scan.outputs.sarif-file }}
  exit-code:
    description: Exit code of the LaraBeacon scan.
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - id: scan
      name: Run LaraBeacon
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LARABEACON_PROFILE: ${{ inputs.profile }}
        LARABEACON_FAIL_ON: ${{ inputs.fail-on }}
        LARABEACON_BASELINE: ${{ inputs.baseline }}
        LARABEACON_SARIF: ${{ inputs.sarif-file }}
        LARABEACON_ARGS: ${{ inputs.args }}
        LARABEACON_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        LARABEACON_REPORT: ${{ inputs.report }}
        LARABEACON_REPORT_USERNAME: ${{ inputs.cloud-username }}
        LARABEACON_REPORT_API_TOKEN: ${{ inputs.cloud-api-token }}
        LARABEACON_REPORT_ENDPOINT: ${{ inputs.cloud-endpoint }}
        LARABEACON_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        LARABEACON_BRANCH: ${{ github.head_ref || github.ref_name }}
        LARABEACON_REPOSITORY: ${{ github.repository }}
      run: |
        if [ ! -f artisan ]; then
          echo "::error::No artisan file found in $LARABEACON_WORKING_DIRECTORY. Install dependencies and point working-directory at the Laravel application."
          exit 1
        fi

        case "$LARABEACON_SARIF" in
          /*|*..*)
            echo "::error::sarif-file must be a relative path inside the working directory."
            exit 1
            ;;
        esac

        options=(--profile="$LARABEACON_PROFILE" --fail-on="$LARABEACON_FAIL_ON" --format=sarif --output="$LARABEACON_SARIF")

        if [ -n "$LARABEACON_BASELINE" ]; then
          options+=(--baseline="$LARABEACON_BASELINE" --only-new)
        fi

        case "$LARABEACON_REPORT" in
          true)
            if [ -z "$LARABEACON_REPORT_USERNAME" ] || [ -z "$LARABEACON_REPORT_API_TOKEN" ]; then
              echo "::warning::LaraBeacon Cloud credentials are not available, so this run is not reported. Secrets are not passed to pull requests from forks."
            else
              export LARABEACON_CLOUD_ENDPOINT="$LARABEACON_REPORT_ENDPOINT"
              export LARABEACON_CLOUD_USERNAME="$LARABEACON_REPORT_USERNAME"
              export LARABEACON_CLOUD_API_TOKEN="$LARABEACON_REPORT_API_TOKEN"
              export LARABEACON_GITHUB_REPO="${LARABEACON_GITHUB_REPO:-$LARABEACON_REPOSITORY}"
              options+=(--report --hash="$LARABEACON_COMMIT" --branch="$LARABEACON_BRANCH")
            fi
            ;;
          false) ;;
          *)
            echo "::error::report must be true or false."
            exit 1
            ;;
        esac

        read -r -a extra <<< "$LARABEACON_ARGS"

        # Without Cloud credentials (for example in pull requests from forks) the upload is skipped, so an AI
        # review cannot be requested either; drop --ai instead of failing the scan.
        if [[ " ${options[*]} " != *" --report "* ]]; then
          filtered=()
          for argument in "${extra[@]}"; do
            [ "$argument" = "--ai" ] || filtered+=("$argument")
          done
          extra=("${filtered[@]}")
        fi

        set +e
        php artisan larabeacon "${options[@]}" "${extra[@]}"
        status=$?
        set -e

        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$LARABEACON_WORKING_DIRECTORY/$LARABEACON_SARIF" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' && hashFiles(steps.scan.outputs.sarif-file) != '' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: larabeacon

    - name: Apply LaraBeacon result
      shell: bash
      run: exit "${{ steps.scan.outputs.exit-code }}"
